version: "3.9"
services:
  vue_boilerplate:
    container_name: vue_boilerplate
    build: 
      context: .
      args:
        - VITE_API_URL=${VITE_API_URL}
    restart: always
    ports:
      - "8880:8880"
    # dev {
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev -- --host 
